esphome:
  name: co2-monitor

esp32:
  board: adafruit_qtpy_esp32s3_n4r2
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # ssid: !secret hotspot_ssid
  # password: !secret hotspot_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Co2-Monitor Fallback Hotspot"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80

i2c:
  sda: GPIO41   # QT Py ESP32-S3 STEMMA QT port — verify against Adafruit's pinout
  scl: GPIO40
  scan: true    # logs detected I2C addresses at boot (expect 0x44 and 0x62)

sensor:
  - platform: scd4x
    co2:
      name: "CO2"
    temperature:
      name: "SCD41 Temperature"
      internal: true
    humidity:
      name: "SCD41 Humidity"
      internal: true
    automatic_self_calibration: true
    update_interval: 30s

  - platform: sht4x
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"
    update_interval: 30s
